  - heading "Privacy policy" [level=1]
- main "Privacy policy":
  - paragraph:
    - strong: "Effective date:"
    - text: July 25, 2026
    - strong: "Last updated:"
    - text: August 7, 2026
  - paragraph: Linklater (the "Service") is operated by Nick Schneble ("we," "us," or "our"). This Privacy Policy describes how we collect, use, and protect your personal information, and the rights you have over it. It applies to everyone who uses the Service, and is posted conspicuously via a link on our homepage.
  - paragraph: "For the purposes of the EU/UK General Data Protection Regulation (\"GDPR\"), the data controller is:"
  - blockquote:
    - paragraph:
      - text: "Nick Schneble Contact:"
      - link "linklater@fancyenchiladas.net":
        - /url: mailto:linklater@fancyenchiladas.net
  - heading "1. Information We Collect" [level=2]
  - paragraph: "We collect only what we need to operate the Service:"
  - heading "Information you provide directly" [level=3]
  - list:
    - listitem:
      - strong: Email address
      - text: Used to create and identify your account and to send you transactional email.
    - listitem:
      - strong: Password
      - text: Stored only as a salted cryptographic hash. We never store or transmit your plaintext password.
    - listitem:
      - strong: Saved links
      - text: The URLs you save to your account, along with metadata our server fetches from those pages so your links are pleasantly presented. Link metadata includes title, description, site name, favicon, and preview image.
    - listitem:
      - strong: Preferences
      - text: Display settings such as theme, light/dark mode, custom theme colors, and accessibility options including Color Vision Deficiency (CVD) mode and an OpenDyslexic typeface.
    - listitem:
      - strong: Two-factor authentication data
      - text: If you enable two-factor authentication, we store your TOTP secret and hashed recovery codes.
  - heading "Information from third-party sign-in" [level=3]
  - list:
    - listitem:
      - text: If you sign in with Google, we receive your email address and Google account identifier from Google. We do not receive your Google password. Google's handling of your data is governed by
      - link "Google's privacy policy":
        - /url: https://policies.google.com/privacy
      - text: .
  - heading "Information collected automatically" [level=3]
  - list:
    - listitem:
      - strong: Cookies and local storage
      - text: Used solely to keep you signed in and to remember your preferences. We don't use cookies for advertising or tracking.
    - listitem:
      - strong: Authentication tokens
      - text: Session, refresh, and any personal access or bookmarklet tokens you create are stored (hashed where possible) to keep your account secure.
    - listitem:
      - strong: Server logs
      - text: Standard technical data generated when you use the Service, retained for security and debugging. This includes your IP address, browser type, and timestamps.
  - paragraph:
    - text: We do
    - strong: not
    - text: use tracking analytics, advertising networks, or third-party trackers, and we do
    - strong: not
    - text: display ads.
  - heading "2. How We Use Your Information" [level=2]
  - region "How we use your information":
