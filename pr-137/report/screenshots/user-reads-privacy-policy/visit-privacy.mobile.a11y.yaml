  - paragraph: Transactional email covers account verification, password resets, magic sign-in links, and account deletion confirmations.
  - paragraph: We do not use your information for marketing, profiling, or automated decision-making that produces legal or similarly significant effects.
  - heading "3. Sharing and Disclosure" [level=2]
  - paragraph: We do not sell, rent, or trade your personal information, and we have not done so in the preceding 12 months. We do not "share" personal information for cross-context behavioral advertising as defined by the CCPA.
  - paragraph: "We disclose personal information only to:"
  - list:
    - listitem:
      - strong: Service providers
      - text: "who process data on our behalf and only as needed to operate the Service:"
      - list:
        - listitem:
          - strong: InterServer
          - text: who hosts the server and database where your data is stored (United States)
        - listitem:
          - strong: GreenGeeks
          - text: who provides the email service that delivers our transactional email. Your email address passes through their mail servers when we send you a message
    - listitem:
      - strong: Google
      - text: ", when you choose to sign in with your Google account"
    - listitem:
      - strong: Gravatar (Automattic)
      - text: "to display your avatar:"
      - list:
        - listitem: Your browser requests a Gravatar image using a one-way hash of your email address
        - listitem: Gravatar does not receive your plaintext email, but if you have a Gravatar account, the hash allows them to recognize you
        - listitem: If you have no Gravatar, a generated placeholder pattern is shown
        - listitem:
          - text: See
          - link "Automattic's privacy policy":
            - /url: https://automattic.com/privacy/
    - listitem:
      - strong: Legal authorities
      - text: ", if required by law, court order, or to protect the rights, safety, or property of our users or others"
    - listitem:
      - strong: A successor operator
      - text: ", in the event the Service changes hands, in which case this policy continues to apply and you'll be notified"
  - paragraph: When you save a link, our server fetches that page to collect its title and preview metadata. This request goes to the site you saved. No information about you is sent other than the standard technical details of any web request made by our server.
  - heading "4. Cookies, Local Storage, and Do Not Track" [level=2]
  - paragraph: We use first-party cookies and browser local storage strictly for authentication and preferences. These are essential to the Service and disabling them will prevent sign-in from working.
  - paragraph: Because we do not track users across websites or over time for third parties, we do not respond differently to browser "Do Not Track" signals. There's no tracking to disable. We honor opt-out preference signals such as Global Privacy Control ("GPC") with respect to CCPA rights. Since we don't sell or share personal information, no additional action results from such signals.
  - heading "5. Data Retention" [level=2]
  - list:
    - listitem:
      - strong: Account data
      - text: Email, password hash, saved links, preferences, tokens, and 2F data are deleted immediately when you delete your account.
    - listitem:
      - strong: Backups
      - text: We keep encrypted database backups for disaster recovery, retained on a rolling schedule of seven daily and four weekly copies. Deleted data ages out of all backups within approximately 35 days.
    - listitem:
      - strong: Server logs
      - text: We do not log routine page visits. The little our servers do log (e.g. startup events and errors) is size-capped, automatically overwritten on a rolling basis as new entries arrive, and never archived.
  - paragraph: We may retain limited data longer where required by law or to resolve disputes.
  - heading "6. International Data Transfers" [level=2]
  - paragraph: Our servers are located in the United States. If you access the Service from the European Economic Area, United Kingdom, or Switzerland, your data is transferred to and stored in the United States.
  - paragraph: This transfer is necessary to provide the Service you request (GDPR Art. 49(1)(b)), and we protect your data in transit with TLS encryption and at rest with the security measures described below.
  - heading "7. Your Rights" [level=2]
  - heading "All users (CalOPPA)" [level=3]
  - paragraph:
    - text: You may review, update, or delete the personal information in your account at any time via your account settings or by contacting us at
    - link "linklater@fancyenchiladas.net":
      - /url: mailto:linklater@fancyenchiladas.net
    - text: . This includes changing your email address, updating preferences, and deleting your account entirely. If we materially change this Privacy Policy, we'll notify you by email and update the "Last updated" date above.
  - heading "European Economic Area, United Kingdom, and Switzerland (GDPR)" [level=3]
  - paragraph: "You have the right to:"
  - list:
    - listitem:
      - strong: Access
      - text: the personal data we hold about you (Art. 15)
    - listitem:
      - strong: Rectify
      - text: inaccurate data (Art. 16)
    - listitem:
      - strong: Erase
      - text: your data ("right to be forgotten") (Art. 17)
    - listitem:
      - strong: Restrict
      - text: processing (Art. 18)
    - listitem:
      - strong: Data portability
      - text: to receive your data in a structured, machine-readable format (Art. 20)
    - listitem:
      - strong: Object
      - text: to processing based on legitimate interests (Art. 21)
    - listitem:
      - strong: Withdraw consent
      - text: at any time, where processing is based on consent, without affecting prior processing (Art. 7(3))
  - paragraph:
    - text: To exercise these rights, contact
    - link "linklater@fancyenchiladas.net":
      - /url: mailto:linklater@fancyenchiladas.net
    - text: . We'll respond within one month. You also have the right to lodge a complaint with your local supervisory authority.
  - heading "California residents (CCPA/CPRA)" [level=3]
  - paragraph: "You have the right to:"
  - list:
    - listitem:
      - strong: Know
      - text: "the categories and specific pieces of personal information we collect, use, and disclose (described in Sections 1–3). In CCPA terms, we collect:"
      - emphasis: identifiers
      - text: (email, account ID),
      - emphasis: internet activity
      - text: (server logs, cookies), and
      - emphasis: user-provided content
      - text: (saved links and preferences) directly from you, from Google when you use Google sign-in, and automatically from your device
    - listitem:
      - strong: Delete
      - text: personal information we hold about you
    - listitem:
      - strong: Correct
      - text: inaccurate personal information
    - listitem:
      - strong: Opt out of sale or sharing
      - text: . Not applicable because we don't sell or share personal information
    - listitem:
      - strong: Limit use of sensitive personal information
      - text: . We use account credentials only to provide the Service, and never for inferring characteristics
    - listitem:
      - strong: Non-discrimination
      - text: . We'll never deny service, charge different prices, or degrade quality because you exercised your privacy rights
  - paragraph:
    - text: Submit requests to
    - link "linklater@fancyenchiladas.net":
      - /url: mailto:linklater@fancyenchiladas.net
    - text: . We'll verify your identity (for example, via your account email) before fulfilling a request, and respond within 45 days. You may designate an authorized agent to submit requests on your behalf.
  - heading "8. Security" [level=2]
  - paragraph: We protect your information using industry-standard measures, including encryption in transit (HTTPS/TLS), salted password hashing, hashed storage of authentication tokens and recovery codes, optional two-factor authentication, and access controls.
  - paragraph: No method of transmission or storage is 100% secure. If we learn of a breach affecting your personal information, we'll notify you and applicable regulators as required by law.
  - heading "9. Children's Privacy" [level=2]
  - paragraph: The Service is not directed at children under 13 (or the higher minimum age required in your jurisdiction, up to 16 in parts of the European Economic Area). We don't knowingly collect personal information from children below these ages. If we learn we've collected such information, we'll delete the account and associated data promptly.
  - paragraph:
    - text: If you believe a child has provided us personal information, contact
    - link "linklater@fancyenchiladas.net":
      - /url: mailto:linklater@fancyenchiladas.net
    - text: .
  - heading "10. Changes to This Policy" [level=2]
  - paragraph: We may update this Privacy Policy from time to time. Material changes will be announced by email to registered users before they take effect. The "Effective date" and "Last updated" dates at the top reflect the current version.
  - heading "11. Contact Us" [level=2]
  - paragraph: "Questions, concerns, or rights requests:"
