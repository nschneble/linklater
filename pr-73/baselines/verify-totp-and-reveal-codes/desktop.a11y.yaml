    - paragraph: Save and stumble upon links right from your bookmarks bar.
    - heading "Bookmarklet" [level=3]
    - status
    - button "Regenerate bookmarklet token": Regenerate
    - paragraph: Drag this button to your bookmarks bar. Click it on any page to save the link directly to Linklater.
