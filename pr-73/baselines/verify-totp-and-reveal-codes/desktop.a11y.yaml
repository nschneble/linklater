      - listitem "Recovery code – navigate here to read it character by character": AAAA-BBBB-1111
      - listitem "Recovery code – navigate here to read it character by character": CCCC-DDDD-2222
      - listitem "Recovery code – navigate here to read it character by character": EEEE-FFFF-3333
