  - region "Enhanced security":
    - heading "Enhanced security" [level=2]
    - paragraph: Set up and manage multi-factor authentication. That's not overkill for a read-it-later app, right?
    - status: Your recovery codes have been generated. Each code can be used once to log in without the authenticator app. They'll only be shown here, so make sure you copy them down before navigating away from this page!
