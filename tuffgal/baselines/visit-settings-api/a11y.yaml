            - checkbox "Show Schema"
            - code: "{ \"id\": \"clz1xyz456\", \"url\": \"https://example.com/great-article\", \"meta\": { \"id\": \"clz1abc123\", \"linkId\": \"clz1xyz456\", \"title\": \"Example Domain\", \"description\": \"This domain is for use in illustrative examples in documents.\", \"imageUrl\": \"https://example.com/og-image.png\", \"faviconUrl\": \"https://example.com/favicon.ico\", \"siteName\": \"Example\", \"source\": \"opengraph\", \"fetchedAt\": \"2026-05-27T12:00:00.000Z\", \"createdAt\": \"2026-05-27T12:00:00.000Z\", \"updatedAt\": \"2026-05-27T12:00:00.000Z\" }, \"createdAt\": \"2026-05-27T12:00:00.000Z\", \"updatedAt\": \"2026-05-27T12:00:00.000Z\", \"readAt\": null }"
