          - button "Copy link"
          - button "Auth Required"
          - group "Operation Description"
          - group "Request Body":
            - text: Body ·
            - button "CreateLinkDto"
            - text: required application/json
            - list:
              - listitem:
                - text: url
                - button "Copy link to url"
                - text: "Type: string required"
                - button "Example"
                - paragraph: The fully-qualified URL to save. Must include the protocol (http:// or https://).
          - text: Responses
          - list "Responses":
            - listitem:
              - button "201 Link created or re-added to the unread list. Metadata fetch queued.":
                - text: "201"
                - paragraph: Link created or re-added to the unread list. Metadata fetch queued.
              - text: application/json
            - listitem:
              - text: "400"
              - paragraph: URL is not a valid URL.
            - listitem:
              - text: "401"
              - paragraph: Missing or invalid token (JWT or PAT).
          - group "Request Example for post/links":
            - text: Request Example for post/links
            - button "Shell Curl"
            - code: "curl /links \\ --request POST \\ --header 'Content-Type: application/json' \\ --header 'Authorization: Bearer YOUR_SECRET_TOKEN' \\ --data '{ \"url\": \"https://example.com/great-article\" }'"
            - button
            - text: Ask AI Agent
            - textbox "Ask AI Agent"
            - button "Test Request (post /links)"
