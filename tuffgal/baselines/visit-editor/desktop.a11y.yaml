- link "Skip to main content":
  - /url: "#main-content"
- banner:
  - button "Go to your links": Linklater Save links now, read them later.
  - button "User menu (testing-ui@linklater.test)"
- main "Links":
  - heading "Theme editor" [level=1]
  - paragraph: Make the app yours. Recolor every surface, watch it change live, and lift a film theme's palette whenever you want a head start.
  - region "Roll your own":
    - heading "Roll your own" [level=2]
    - paragraph: Start from a blank palette, or copy a film theme's colors and tweak from there.
    - switch "Use your own custom theme"
    - text: Use your own custom theme
    - paragraph: Off by default. Flip it on to edit your colors here and show your custom theme in the picker alongside the built-in ones.
    - group "Copy palette from theme":
      - button "Copy palette from theme" [disabled]
      - menu "Copy palette from theme":
        - menuitem "Apollo 10½ Accessible theme"
        - menuitem "A Scanner Darkly"
