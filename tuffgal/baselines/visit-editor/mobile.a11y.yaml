- status
- link "Skip to main content":
  - /url: "#main-content"
- banner:
  - button "Go to your links": Linklater Save links now, read them later.
  - button "User menu (testing-ui@linklater.test)"
  - dialog "User menu":
    - menu "User menu":
      - group "Logged in as":
        - paragraph: Logged in as
        - paragraph: testing-ui@linklater.test
      - menuitem "Your links"
      - menuitem "Settings"
      - menuitem "Switch to light mode"
      - menuitem "Craft your theme"
      - menuitem "Theme A Scanner Darkly"
      - menuitem "Log out"
    - menu "Theme":
      - menuitem "Back to main menu"
      - paragraph: Themes
      - menuitemradio "Apollo 10½ Accessible theme"
      - menuitemradio "A Scanner Darkly" [checked]
      - menuitemradio "Before Sunrise"
      - menuitemradio "Before Sunset"
      - menuitemradio "Before Midnight"
      - menuitemradio "Boyhood"
      - menuitemradio "Dazed and Confused"
      - menuitemradio "Hit Man"
      - menuitemradio "Nouvelle Vague"
      - menuitemradio "School of Rock"
- main "Theme editor":
  - heading "Theme editor" [level=1]
  - img "Theme colors meet minimum contrast"
  - paragraph: All changes are saved automatically.
  - status
  - tablist "Palette to edit":
    - tab "Light"
    - tab "Dark" [selected]
  - button "Randomize"
  - button "Copy A Scanner Darkly" [disabled]
  - text: Already using A Scanner Darkly's colors. Edit a color or Randomize to start a custom theme.
  - tabpanel "Dark":
    - region "Color Bundles":
      - heading "Color Bundles" [level=2]
      - note: These start from A Scanner Darkly. Editing any color saves it as your own theme.
      - tablist "Color Bundles":
        - tab "Base" [selected]
        - tab "Mount"
        - tab "Orbit"
        - tab "Alert"
        - tab "Warn"
        - tab "Info"
        - tab "Success"
      - heading "Colors" [level=3]
      - tabpanel "Base":
        - paragraph: Background
        - textbox "Color picker for Background": "#0f0b1b"
        - textbox "Value for Background":
          - /placeholder: "#000000"
          - text: "#0f0b1b"
        - paragraph: Border
        - textbox "Color picker for Border": "#847ecc"
        - textbox "Value for Border":
          - /placeholder: "#000000"
          - text: "#847ecc"
        - paragraph: Text
        - textbox "Color picker for Text": "#eeeedf"
        - textbox "Value for Text":
          - /placeholder: "#000000"
          - text: "#eeeedf"
        - paragraph: Alt text
        - textbox "Color picker for Alt text": "#ebcaae"
        - textbox "Value for Alt text":
          - /placeholder: "#000000"
          - text: "#ebcaae"
        - paragraph: Highlight
        - textbox "Color picker for Highlight": "#ed9156"
        - textbox "Value for Highlight":
          - /placeholder: "#000000"
          - text: "#ed9156"
        - paragraph: Highlight hover
        - textbox "Color picker for Highlight hover": "#f5a878"
        - textbox "Value for Highlight hover":
          - /placeholder: "#000000"
          - text: "#f5a878"
        - paragraph: Highlight text
        - textbox "Color picker for Highlight text": "#1a0e08"
        - textbox "Value for Highlight text":
          - /placeholder: "#000000"
          - text: "#1a0e08"
        - paragraph: Input
        - textbox "Color picker for Input": "#201e43"
        - textbox "Value for Input":
          - /placeholder: "#000000"
          - text: "#201e43"
        - paragraph: Subtle text
        - textbox "Color picker for Subtle text": "#bcdc6f"
        - textbox "Value for Subtle text":
          - /placeholder: "#000000"
          - text: "#bcdc6f"
        - paragraph: Focus
        - textbox "Color picker for Focus": "#ed9156"
        - textbox "Value for Focus":
          - /placeholder: "#000000"
          - text: "#ed9156"
    - region "Live preview":
      - heading "Live preview" [level=2]
      - text: Preview
      - paragraph: Page defaults. Covers elements like the page title, search input, and navigation buttons.