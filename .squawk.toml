pg_version = "16.0"

excluded_rules = [
  # Prisma generates TIMESTAMP(3) by default — use @db.Timestamptz in schema to opt in per-field
  "prefer-timestamptz",
  # Prisma wraps every migration in a transaction; CONCURRENTLY cannot run inside a transaction
  "require-concurrent-index-creation",
  "require-concurrent-index-deletion",
  # Prisma manages migration idempotency via its own state tracking, not IF NOT EXISTS guards
  "prefer-robust-stmts",
  # This app deploys as a single instance with a maintenance window for migrations, not rolling
  # deployments — column drops, NOT NULL drops, NOT NULL adds, and renames run atomically and
  # are safe. ACCESS EXCLUSIVE locks during a maintenance window have no concurrent readers to
  # block, so the rolling-deploy hazard these rules guard against does not apply here.
  "adding-not-nullable-field",
  "ban-drop-column",
  "ban-drop-not-null",
  "renaming-column",
  # totpLastUsedStep is a TOTP time-step counter (unix_time / 30 ≈ 58M today) — it won't
  # approach the 32-bit INTEGER limit (~2.1B) until ~year 4000; BigInt would change the
  # TypeScript types throughout the TOTP service for no practical benefit
  "prefer-bigint-over-int",
]
