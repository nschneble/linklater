      - text: Save to Linklater
    - paragraph: Your auth token is embedded in this bookmarklet. It never expires, but it can be regenerated if someone else gains access to it.
    - heading "Stumble!" [level=3]
    - paragraph: Drag this button to your bookmarks bar. Click it to automatically open a random unread link from your collection.
    - link "Drag this Stumble! button to your bookmarks bar. Click it to automatically open a random unread link from your collection.":
