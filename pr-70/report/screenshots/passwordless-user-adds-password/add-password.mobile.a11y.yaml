  - region "Account":
    - heading "Account" [level=2]
    - paragraph: Manage your email address, password, and any identity providers (IdPs) you've connected.
    - form "Email":
      - heading "Email" [level=3]
      - text: testing-ui@linklater.test Verified New email
      - textbox "New email":
        - /placeholder: Leave blank to keep testing-ui@linklater.test
      - button "Change email address" [disabled]
    - form "Password":
      - heading "Password" [level=3]
      - text: No password has been set Password
      - textbox "Password"
      - button "Add password" [disabled]
  - region "Enhanced security":
    - heading "Enhanced security" [level=2]
    - paragraph: Set up and manage multi-factor authentication. That's not overkill for a read-it-later app, right?
    - paragraph: MFA is currently off.
    - button "Add authenticator app"
    - text: Recommended
  - region "Accessibility":
    - heading "Accessibility" [level=2]
    - paragraph: Adjust how Linklater looks and feels.
    - text: Color Vision Deficiency (CVD) mode
    - paragraph: Switches to the Apollo 10½ theme and adds distinctive visual non-color cues, including underlined links, striped disabled controls, stronger focus outlines, and selected indicator bars.
    - switch "Color Vision Deficiency (CVD) mode": "Off"
    - text: OpenDyslexic font
    - paragraph: Switches the app's interface font to OpenDyslexic, a typeface designed for readers with dyslexia. It uses heavier strokes and more distinctive letter shapes than the default font (for example, asymmetric b/d/p/q).
    - switch "OpenDyslexic font": "Off"
    - text: Keyboard shortcuts
    - paragraph:
      - text: Provides quick keyboard navigation for many actions on the
      - button "Your Links"
      - text: page, such as Q to search and A to add links.
    - switch "Keyboard shortcuts" [checked]: "On"
  - region "Browser bookmarks":
    - heading "Browser bookmarks" [level=2]
    - paragraph: Save and stumble upon links right from your bookmarks bar.
    - heading "Bookmarklet" [level=3]
    - status
    - button "Regenerate bookmarklet token": Regenerate
    - paragraph: Drag this button to your bookmarks bar. Click it on any page to save the link directly to Linklater.
    - status
    - link "Save to Linklater – drag to your bookmarks bar, or click on any page to save that link":
