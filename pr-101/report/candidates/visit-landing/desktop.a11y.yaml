- main:
  - region "Linklater":
    - heading "Linklater" [level=1]
    - paragraph: Save links now, read them later.
    - paragraph: Most curious adults come across dozens of interesting articles on any given day. Do they have time to read them all? Nope. Do they often forget about them? Totally.
    - link "Get started":
      - /url: /signup
    - link "Log in":
      - /url: /login
  - region "Features":
    - heading "Features" [level=2]
    - heading "Save" [level=3]
    - paragraph: Save links from literally anywhere. A New York Times recipe on your laptop. A Reddit thread on your phone. A Facebook post your mom emailed you, again.
    - heading "Stumble!" [level=3]
    - paragraph: Decision fatigue is real. We can serve up a random unread link from your collection, and all you gotta do is read it. Bringing back the best of the 2000s!
    - heading "Share" [level=3]
    - paragraph: Half the fun of learning something new is sharing it with those around you. Be the annoying person at the metaphorical water cooler with a fun fact.
