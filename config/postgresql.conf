# Listen on all interfaces inside the container so the API and the migrate
# one-shot can reach Postgres over the Compose network. Supplying our own
# config_file replaces the image default (which sets this to '*'), and the
# Postgres compiled default is 'localhost' — which would make the DB reachable
# only from inside its own container. Not a firewall exposure: no ports are
# published, so this is reachable only on the internal Compose network.
listen_addresses = '*'
effective_cache_size = 2GB
maintenance_work_mem = 128MB
max_connections = 50
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_worker_processes = 4
random_page_cost = 1.1
shared_buffers = 1GB
work_mem = 8MB
