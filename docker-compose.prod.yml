# Production stack for the single-VPS deployment (docs/DEPLOYMENT.md, option 1):
# Postgres, the NestJS API (which runs pg-boss in-process — no separate worker),
# and Caddy serving the static web build and terminating TLS on one domain.
#
# Secrets are NOT committed. Every ${VAR} below is supplied at deploy time from
# the host environment or an operator-provided env file kept out of the repo
# (e.g. `docker compose --env-file /etc/linklater/production.env -f
# docker-compose.prod.yml up -d`). docs/DEPLOYMENT.md's "Required human actions"
# section lists every value and which ones the API refuses to start without
# (JWT_SECRET, TOTP_ENCRYPTION_KEY, DATABASE_URL, APP_URL).
#
# Image references: CI publishes both images to ghcr.io tagged with the commit
# SHA and `latest` (DEPLOYMENT.md update-deploy flow). The deploy workflow passes
# API_IMAGE / WEB_IMAGE (derived from github.repository_owner) and IMAGE_TAG at
# deploy time; IMAGE_TAG selects which tag to run, so rollback is redeploying a
# prior SHA. The ghcr.io/nschneble/* defaults below are only a fallback for a
# hand-run local compose; the workflow is the source of truth for the owner.
#
# Migrations run at deploy time, before the new API starts, e.g.
#   docker compose -f docker-compose.prod.yml run --rm api \
#     sh -c 'cd /app/apps/api && npx prisma migrate deploy'
# (npm run migrate:deploy also runs `prisma generate`, which is already baked
# into the image; the bare CLI call is the leaner deploy-time step.)

# Container stdout is the only place logs land (no service writes files):
# Caddy has no `log` directive, so nothing here keeps an access log. What the
# API writes beside its lifecycle lines is a line per notable event, never one
# per request: a refused refresh, a blocked outbound fetch, a background write
# that failed. The stream grows with those events rather than with traffic.
# Without this block Docker's json-file driver would keep it forever; the caps
# bound it to ~30MB per service, which is what makes the privacy policy's
# "rolling basis, automatically overwritten, never archived" retention
# statement true by construction (docs/PRIVACY.md, Data Retention).
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    # postgres:16 matches the CI-tested version. The official image ships the
    # contrib modules, so the `unaccent` extension the search migration enables
    # is available without an extra build step.
    image: postgres:16
    restart: unless-stopped
    logging: *bounded-logging
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      # pg_isready gates the API's depends_on so the API never boots against a
      # Postgres that has not finished initializing.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    # Published by CI to GHCR. Build locally with:
    #   docker build -f apps/api/Dockerfile -t linklater-api .
    image: ${API_IMAGE:-ghcr.io/nschneble/linklater-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      # Core (API exits at startup without these — see main.ts).
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      # Recommended in production: narrow CORS from the default open `*`.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Optional integrations (absent = feature simply off). See DEPLOYMENT.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      EXTENSION_REDIRECT_URIS: ${EXTENSION_REDIRECT_URIS:-}
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=768'
      PORT: '3000'
    # No published ports: only Caddy reaches the API, over the Compose network.
    expose:
      - '3000'

  web:
    # Caddy image with the static web bundle baked in at /srv (apps/web/Dockerfile).
    # Build locally with:
    #   docker build -f apps/web/Dockerfile \
    #     --build-arg VITE_API_BASE_URL=/api -t linklater-web .
    image: ${WEB_IMAGE:-ghcr.io/nschneble/linklater-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      - api
    environment:
      # Consumed by the mounted Caddyfile for TLS/vhost. Must resolve to this box.
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # The production reverse-proxy + TLS config (overrides the image's
      # self-contained static-only Caddyfile).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certificates and ACME state across restarts so Caddy does
      # not re-request certificates (and hit Let's Encrypt rate limits) on every
      # redeploy.
      - caddy-data:/data
      - caddy-config:/config

  backup:
    # Reuse postgres:16 so pg_dump/pg_restore exactly match the server version
    # (pg_dump must be >= the server). No extra image to pull or tag-pin, and it
    # ships psql/createdb/dropdb for the restore procedure in DEPLOYMENT.md.
    image: postgres:16
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # A logical dump of a personal-scale database is light; this is a
          # generous ceiling that keeps the sidecar from ever crowding the API.
          memory: 256M
    environment:
      # libpq connection to the postgres service over the Compose network. The
      # database is never published; this reaches it by service name only, and
      # reuses the same POSTGRES_* secrets the postgres service is given.
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Nightly dump time (UTC hour) and retention windows. Tunable, with the
      # documented defaults: 7 daily dumps plus 4 weekly dumps.
      BACKUP_SCHEDULE_HOUR: ${BACKUP_SCHEDULE_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      # Dump-at-rest encryption (AES-256 via openssl). Set it — the privacy
      # policy's "encrypted backups" statement depends on it, and the script
      # warns on every run it takes an unencrypted dump. Losing this
      # passphrase makes every backup unrestorable, so keep a copy somewhere
      # that survives the VPS (see DEPLOYMENT.md "Required human actions").
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
    volumes:
      # The backup script (read-only) and the dump volume that outlives the
      # container. The operator syncs postgres-backups offsite (DEPLOYMENT.md).
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - postgres-backups:/backups
    # Override the postgres image entrypoint: run the backup loop instead of the
    # database. `docker compose run --rm backup once` appends "once" to take a
    # single on-demand dump.
    entrypoint: ['bash', '/usr/local/bin/backup-postgres.sh']

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  postgres-backups:
