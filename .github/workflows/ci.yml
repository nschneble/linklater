name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linklater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/linklater_test?schema=public'
      JWT_SECRET: 'ci-jwt-secret'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Lint Migrations
        uses: sbdchd/squawk-action@v2
        with:
          pattern: 'apps/api/prisma/migrations/**/*.sql'
          version: 'latest'

      - name: Test API
        run: npm run test --workspace @linklater/api

      - name: Test Web
        run: npm run test --workspace @linklater/web

      - name: Build
        run: npm run build
