# Deploys Linklater to a single VPS production stack.
#
#   1. Builds the API and web images
#   2. Publishes both to ghcr.io, tagged with the commit SHA + `latest`
#   3. SSHs to the VPS, pulls the images, runs all Prisma migrations,
#      and then brings up the Docker container
#   4. Polls the `/api/health` endpoint until it returns 200
#
# Required GitHub Repository secrets
#  (Settings → Security and quality → Secrets and variables → Actions)
#
# Required GitHub Repository secrets:
#
#   SSH_HOST        VPS hostname or IP address
#   SSH_PORT        SSH port (optional, defaults to 22)
#   SSH_USER        SSH user on the VPS (must be in `docker` group)
#   SSH_KEY         Private SSH key matching the public key on the VPS
#   DEPLOY_PATH     Absolute path on the VPS
#   PRODUCTION_ENV  Full list of environment variables as key-value pairs
#
#                   APP_URL, BACKUP_ENCRYPTION_PASSPHRASE, CORS_ORIGIN,
#                   DATABASE_URL, DOMAIN, JWT_SECRET, POSTGRES_DB,
#                   POSTGRES_PASSWORD, POSTGRES_USER, SMTP_FROM, SMTP_HOST,
#                   SMTP_PASS, SMTP_PORT, SMTP_SECURE, SMTP_USER,
#                   TOTP_ENCRYPTION_KEY
#
#                   Optional: GOOGLE_*, APPLE_*, EXTENSION_REDIRECT_URIS
#
# Optional GitHub Repository variables (Actions → Variables):
#
#   VITE_GOOGLE_SSO_ENABLED  Set to `true` to render the Google login button.
#                            Baked into the web image at build time (see
#                            docs/GOOGLE-SSO.md); defaults off when unset.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The image tag to deploy. Can be a prior commit SHA to roll back or `latest` for the newest build. Required. There is no default so a bare dispatch cannot silently roll forward to `latest`.'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/linklater-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/linklater-web

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_SSO_ENABLED=${{ vars.VITE_GOOGLE_SSO_ENABLED }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: tag
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESOLVED_TAG="$INPUT_IMAGE_TAG"
            if [ -z "$RESOLVED_TAG" ]; then
              echo "::error::An image_tag is required on a manual dispatch. Either a prior SHA to roll back to, or \`latest\`."
              exit 1
            fi
          else
            RESOLVED_TAG="${{ github.sha }}"
          fi

          if ! printf '%s' "$RESOLVED_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::Invalid image_tag '$RESOLVED_TAG'. Expected a Docker tag: 1-128 chars of [A-Za-z0-9._-], not starting with a separator."
            exit 1
          fi

          echo "value=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"

      - name: Sync compose + config to the VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml,Caddyfile,config/postgresql.conf,scripts/backup-postgres.sh
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,API_IMAGE,WEB_IMAGE,DEPLOY_PATH,PRODUCTION_ENV,REGISTRY,GHCR_ACTOR,GHCR_TOKEN,HEALTHCHECK_URL
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # writes the production env file
            printf '%s\n' "$PRODUCTION_ENV" > production.env

            # logs the VPS's Docker into GHCR so it can pull the images
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_ACTOR" --password-stdin

            # forwards the resolved image references
            export IMAGE_TAG API_IMAGE WEB_IMAGE
            COMPOSE="docker compose --env-file production.env -f docker-compose.prod.yml"

            # pulls the resolved images
            $COMPOSE pull

            # run migrations
            $COMPOSE run --rm --user root api sh -c 'cd /app/apps/api && npx prisma migrate deploy'

            # rolls the services onto the new images
            $COMPOSE up -d

            docker logout "$REGISTRY" || true

            # polls /api/health until 200 or fails the deploy
            if [ -z "${HEALTHCHECK_URL:-}" ]; then
              DEPLOY_DOMAIN=$(grep -E '^DOMAIN=' production.env | head -n1 | cut -d= -f2- | tr -d '"')
              HEALTHCHECK_URL="https://${DEPLOY_DOMAIN}/api/health"
            fi
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL" || echo 000)
              if [ "$status" = "200" ]; then
                echo "Health check passed (HTTP 200) after ${attempt} attempt(s)."
                exit 0
              fi
              echo "Health check attempt ${attempt}: HTTP ${status}. Retrying in 5s."
              sleep 5
            done
            echo "Health check never returned 200. Deploy failed."
            exit 1
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
