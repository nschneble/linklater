name: testing-ui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testing-ui:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linklater_testing_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TESTING_UI: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/linklater_testing_ui?schema=public'
      JWT_SECRET: 'ci-jwt-secret'

    steps:
      - uses: actions/checkout@v4
      - uses: nschneble/tuffgal-action@v0
        with:
          setup-script: test:ui:setup
